<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ThreatGuard AI // Responsive Cyber Threat & Digital Trust Command Center</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          screens: {
            'xs': '420px',
            'sm': '640px',
            'md': '768px',
            'lg': '1024px',
            'xl': '1280px',
            '2xl': '1536px',
          },
          colors: {
            cyber: {
              950: '#060813',
              900: '#090e1d',
              850: '#0d1424',
              800: '#121c34',
              750: '#182646',
              700: '#1f3056',
              cyan: '#00f2fe',
              blue: '#38bdf8',
              emerald: '#10b981',
              amber: '#f59e0b',
              crimson: '#ef4444',
              purple: '#8b5cf6'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          boxShadow: {
            'glow-cyan': '0 0 25px rgba(0, 242, 254, 0.25)',
            'glow-crimson': '0 0 25px rgba(239, 68, 68, 0.3)',
            'glow-emerald': '0 0 25px rgba(16, 185, 129, 0.25)',
            'glow-amber': '0 0 25px rgba(245, 158, 11, 0.25)',
            'glass': '0 10px 30px rgba(0, 0, 0, 0.5)'
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM, and Babel Standalone (Cloudflare CDN) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    /* Prevent horizontal page overflow on small devices */
    html, body {
      overflow-x: hidden;
      max-width: 100vw;
    }

    /* Cyber scanlines grid pattern */
    .cyber-grid {
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* Ambient glowing orbs (hidden or scaled down on mobile for high GPU frame-rates) */
    .glow-orb-cyan {
      width: clamp(280px, 40vw, 500px);
      height: clamp(280px, 40vw, 500px);
      background: radial-gradient(circle, rgba(0, 242, 254, 0.16) 0%, transparent 70%);
      filter: blur(100px);
    }
    .glow-orb-purple {
      width: clamp(300px, 45vw, 550px);
      height: clamp(300px, 45vw, 550px);
      background: radial-gradient(circle, rgba(139, 92, 246, 0.14) 0%, transparent 70%);
      filter: blur(110px);
    }

    /* Hide scrollbars while preserving touch smooth scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    /* Print styles for Executive Audit PDF Report */
    @media print {
      body { background: #fff !important; color: #000 !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .print-card { border: 1px solid #cbd5e1 !important; background: #fff !important; color: #000 !important; box-shadow: none !important; }
    }
  </style>
</head>
<body class="bg-cyber-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden antialiased selection:bg-cyber-cyan selection:text-cyber-950">
  
  <!-- Ambient Cyber Background -->
  <div class="fixed inset-0 cyber-grid pointer-events-none z-0"></div>
  <div class="fixed -top-20 -left-20 glow-orb-cyan pointer-events-none z-0"></div>
  <div class="fixed top-1/3 -right-24 glow-orb-purple pointer-events-none z-0"></div>

  <!-- React Root Container -->
  <div id="root" class="relative z-10 flex flex-col min-h-screen w-full"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- Inline Responsive Vector Icons ---
    const ShieldIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    );

    const SearchIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    );

    const AlertOctagonIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    );

    const LockIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    );

    const GlobeIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
    );

    const FileTextIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
      </svg>
    );

    const ZapIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
    );

    const DatabaseIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
      </svg>
    );

    // --- Main Responsive Dashboard Component ---
    function DashboardApp() {
      const [urlInput, setUrlInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [loadingStep, setLoadingStep] = useState("");
      const [scanData, setScanData] = useState(null);
      const [error, setError] = useState(null);
      const [activeTab, setActiveTab] = useState("threat");
      const [dbStatus, setDbStatus] = useState({ 
        is_cloud_active: false, 
        engine: "sqlite",
        provider: "SQLite (Air-Gapped)",
        fallback: "threat_intel.db",
        air_gapped_mode: true,
        status_reason: "Testing network connectivity...",
        latency_ms: 0,
        checked: false
      });
      const [dbModalOpen, setDbModalOpen] = useState(false);
      const [dbPingLoading, setDbPingLoading] = useState(false);
      const [dbPingNotice, setDbPingNotice] = useState("");
      const [threatFeed, setThreatFeed] = useState([]);
      const [stixModalOpen, setStixModalOpen] = useState(false);
      const [stixContent, setStixContent] = useState("");
      const [reportModalOpen, setReportModalOpen] = useState(false);
      const [copiedStix, setCopiedStix] = useState(false);

      // Bookmarklet configuration
      const bookmarkletCode = useMemo(() => {
        const origin = window.location.origin;
        return `javascript:(function(){var u=encodeURIComponent(window.location.href);window.open('${origin}/?url='+u,'_blank');})();`;
      }, []);

      // High-Contrast Test Scenarios Presets
      const presets = [
        { 
          label: "PayPal Phish", 
          tag: "PHISH", 
          tagStyle: "bg-red-500 text-white font-black shadow-sm", 
          btnStyle: "bg-red-950/50 border-red-500/50 hover:bg-red-900/60 hover:border-red-400 text-red-100", 
          url: "http://paypa1-security-verification.update-account.tk/login" 
        },
        { 
          label: "eMudhra 1024b", 
          tag: "eMUDHRA", 
          tagStyle: "bg-amber-400 text-amber-950 font-black shadow-sm", 
          btnStyle: "bg-amber-950/50 border-amber-500/50 hover:bg-amber-900/60 hover:border-amber-400 text-amber-100", 
          url: "https://emudhra-auth-portal.fraud-verify.com" 
        },
        { 
          label: "Job Scam", 
          tag: "SCAM", 
          tagStyle: "bg-orange-500 text-white font-black shadow-sm", 
          btnStyle: "bg-orange-950/50 border-orange-500/50 hover:bg-orange-900/60 hover:border-orange-400 text-orange-100", 
          url: "http://amazon-global-careers-recruit.xyz/apply" 
        },
        { 
          label: "Chase Bank", 
          tag: "SAFE", 
          tagStyle: "bg-emerald-400 text-emerald-950 font-black shadow-sm", 
          btnStyle: "bg-emerald-950/50 border-emerald-500/50 hover:bg-emerald-900/60 hover:border-emerald-400 text-emerald-100", 
          url: "https://chase.com" 
        },
        { 
          label: "Plaintext HTTP", 
          tag: "HTTP", 
          tagStyle: "bg-slate-300 text-slate-950 font-black shadow-sm", 
          btnStyle: "bg-slate-900/60 border-slate-500/50 hover:bg-slate-800/70 hover:border-slate-400 text-slate-100", 
          url: "http://legacy-banking.insecure.test" 
        }
      ];

      // Refresh or check database connection status
      const checkDbStatus = useCallback(async (force = false) => {
        setDbPingLoading(true);
        try {
          const res = await fetch(`/api/system/db-status?force_refresh=${force}`);
          const data = await res.json();
          setDbStatus({
            is_cloud_active: !!data.is_cloud_active,
            engine: data.engine || (data.is_cloud_active ? "supabase" : "sqlite"),
            provider: data.provider || (data.is_cloud_active ? "Supabase (Cloud PostgreSQL)" : "SQLite (Local / Air-Gapped)"),
            fallback: data.database_file || "threat_intel.db",
            air_gapped_mode: !data.is_cloud_active,
            air_gap_override: data.air_gap_override,
            status_reason: data.status_reason || "",
            latency_ms: data.latency_ms || 0,
            checked: true
          });
          const modeLabel = data.is_cloud_active 
            ? "☁️ Supabase Cloud Active (PostgreSQL RLS)" 
            : "📴 SQLite Air-Gapped Mode Active (Local Failover)";
          setDbPingNotice(`${modeLabel} • ${data.status_reason || 'Checked'} (${new Date().toLocaleTimeString()})`);
        } catch (err) {
          setDbStatus({
            is_cloud_active: false,
            engine: "sqlite",
            provider: "SQLite (Local / Air-Gapped)",
            fallback: "threat_intel.db",
            air_gapped_mode: true,
            status_reason: "Offline Host / Air-Gapped Environment",
            latency_ms: 0,
            checked: true
          });
          setDbPingNotice(`📴 Air-Gapped Mode Active • Local SQLite Offline (${new Date().toLocaleTimeString()})`);
        } finally {
          setDbPingLoading(false);
        }
      }, []);

      // Toggle Air-Gapped Simulation Mode
      const toggleAirGapMode = useCallback(async () => {
        setDbPingLoading(true);
        try {
          const res = await fetch("/api/system/toggle-airgap", { method: "POST" });
          const data = await res.json();
          setDbStatus({
            is_cloud_active: !!data.is_cloud_active,
            engine: data.engine || (data.is_cloud_active ? "supabase" : "sqlite"),
            provider: data.provider,
            fallback: data.database_file || "threat_intel.db",
            air_gapped_mode: !data.is_cloud_active,
            air_gap_override: data.air_gap_override,
            status_reason: data.status_reason || "",
            latency_ms: data.latency_ms || 0,
            checked: true
          });
          setDbPingNotice(data.is_cloud_active 
            ? `☁️ Switched to Cloud Mode (Supabase Active)` 
            : `📴 Switched to Air-Gapped Mode (SQLite Active)`);
        } catch (err) {
          console.error("Air-gap toggle failed:", err);
        } finally {
          setDbPingLoading(false);
        }
      }, []);

      // Initial load: database status, threat feed, query param auto-scan, and browser network listener
      useEffect(() => {
        checkDbStatus(true);

        const handleOnline = () => checkDbStatus(true);
        const handleOffline = () => {
          setDbStatus(prev => ({
            ...prev,
            is_cloud_active: false,
            engine: "sqlite",
            provider: "SQLite (Local / Air-Gapped)",
            air_gapped_mode: true,
            status_reason: "Browser detected offline state"
          }));
        };

        window.addEventListener("online", handleOnline);
        window.addEventListener("offline", handleOffline);

        fetch("/api/threats/feed?limit=6")
          .then(res => res.json())
          .then(data => setThreatFeed(data.feed || []))
          .catch(() => {});

        const params = new URLSearchParams(window.location.search);
        const autoUrl = params.get("url");
        if (autoUrl) {
          setUrlInput(autoUrl);
          runAudit(autoUrl);
        }

        return () => {
          window.removeEventListener("online", handleOnline);
          window.removeEventListener("offline", handleOffline);
        };
      }, [checkDbStatus]);

      // Core Scan Execution Function
      const runAudit = useCallback(async (targetUrl) => {
        const query = (targetUrl || urlInput || "https://chase.com").trim();
        setUrlInput(query);
        setLoading(true);
        setError(null);
        setLoadingStep("Validating X.509 cryptography, checking eMudhra key patterns, and parsing DOM forms...");

        try {
          const resp = await fetch(`/analyze?url=${encodeURIComponent(query)}`);
          if (!resp.ok) {
            const errJson = await resp.json();
            throw new Error(errJson.detail || "Target audit request failed");
          }
          const data = await resp.json();
          setScanData(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }, [urlInput]);

      // Smooth scroll and activate deep inspection tab
      const scrollToTab = useCallback((tabKey) => {
        setActiveTab(tabKey);
        setTimeout(() => {
          const el = document.getElementById("inspection-tabs-section");
          if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }, 60);
      }, []);

      const handleOpenStix = async () => {
        setStixModalOpen(true);
        setStixContent("Loading standardized OASIS STIX 2.1 bundle...");
        try {
          const resp = await fetch("/api/threats/stix");
          const json = await resp.json();
          setStixContent(JSON.stringify(json, null, 2));
        } catch (e) {
          setStixContent("// Failed to load STIX: " + e.message);
        }
      };

      const handleCopyStix = () => {
        navigator.clipboard.writeText(stixContent);
        setCopiedStix(true);
        setTimeout(() => setCopiedStix(false), 2000);
      };

      const handleVote = async (reportId, voteType) => {
        try {
          const res = await fetch("/api/intel/vote", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ report_id: reportId, vote_type: voteType })
          });
          const json = await res.json();
          if (json.success && scanData) {
            runAudit(scanData.target_url);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleReportSubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const payload = {
          target_url: formData.get("url"),
          category: formData.get("category"),
          impersonated_brand: formData.get("brand") || null,
          description: formData.get("desc")
        };

        try {
          const resp = await fetch("/api/intel/report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const res = await resp.json();
          if (res.success) {
            alert("✓ Threat report successfully registered in global intelligence feed.");
            setReportModalOpen(false);
            if (scanData && scanData.target_url === payload.target_url) {
              runAudit(payload.target_url);
            }
          }
        } catch (err) {
          alert("Submission error: " + err.message);
        }
      };

      return (
        <div className="flex flex-col min-h-screen w-full">
          
          {/* Responsive Header / Nav Bar */}
          <header className="border-b border-white/10 bg-cyber-950/90 backdrop-blur-xl sticky top-0 z-50 no-print w-full">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 min-h-16 py-2.5 sm:py-0 flex flex-wrap items-center justify-between gap-3">
              
              {/* Brand Logo & Name */}
              <div className="flex items-center space-x-2.5 sm:space-x-3">
                <div className="w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl bg-gradient-to-br from-cyber-cyan via-sky-500 to-indigo-600 flex items-center justify-center text-cyber-950 shadow-glow-cyan shrink-0">
                  <ShieldIcon className="w-5 h-5 sm:w-6 sm:h-6" />
                </div>
                <div>
                  <div className="text-base sm:text-xl font-extrabold tracking-tight text-white flex items-center">
                    ThreatGuard<span className="text-cyber-cyan">.</span>AI
                  </div>
                  <div className="text-[8px] sm:text-[10px] uppercase tracking-wider font-bold text-slate-400">
                    Cyber Threat & Trust Command
                  </div>
                </div>
              </div>

              {/* Status Controls & Action Pills */}
              <div className="flex items-center flex-wrap gap-2">
                {/* Dynamic Real-Time Network & Security Mode Pill */}
                {dbStatus.is_cloud_active ? (
                  <div className="hidden xs:flex items-center space-x-1.5 bg-emerald-500/10 border border-emerald-500/35 px-2.5 py-1 rounded-full text-[11px] font-mono font-bold text-cyber-emerald shadow-[0_0_12px_rgba(16,185,129,0.25)]">
                    <span className="w-2 h-2 rounded-full bg-cyber-emerald animate-pulse shadow-[0_0_8px_#10b981]"></span>
                    <span>ONLINE</span>
                  </div>
                ) : (
                  <div className="hidden xs:flex items-center space-x-1.5 bg-amber-500/15 border border-amber-500/40 px-2.5 py-1 rounded-full text-[11px] font-mono font-bold text-amber-300 shadow-[0_0_12px_rgba(245,158,11,0.25)]">
                    <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse shadow-[0_0_8px_#f59e0b]"></span>
                    <span>📴 AIR-GAPPED</span>
                  </div>
                )}

                {/* Dual Database Persistence Hub (Supabase + SQLite side-by-side with active glow) */}
                <div 
                  onClick={() => setDbModalOpen(true)}
                  title="Click to view Dual-Database Architecture details"
                  className="flex items-center p-0.5 sm:p-1 bg-cyber-900/90 rounded-xl border border-white/10 cursor-pointer hover:border-cyber-cyan/40 transition-all shadow-md group"
                >
                  {/* Supabase Engine Chip */}
                  <div className={`flex items-center space-x-1 sm:space-x-1.5 px-2 sm:px-2.5 py-1 rounded-lg text-[10px] sm:text-xs font-mono font-bold transition-all ${
                    dbStatus.is_cloud_active
                      ? 'bg-emerald-500/25 text-emerald-300 border border-emerald-400/60 shadow-[0_0_18px_rgba(16,185,129,0.55)] ring-1 ring-emerald-400/40 glow-db-active-emerald'
                      : 'bg-white/[0.03] text-slate-400 border border-transparent opacity-65 group-hover:opacity-85'
                  }`}>
                    <span className={`w-2 h-2 rounded-full ${
                      dbStatus.is_cloud_active
                        ? 'bg-emerald-400 animate-pulse shadow-[0_0_8px_#34d399]'
                        : 'bg-slate-500'
                    }`} />
                    <span>☁️ Supabase</span>
                    <span className={`text-[8px] sm:text-[9px] px-1.5 py-0.2 rounded font-sans uppercase font-extrabold tracking-wider ${
                      dbStatus.is_cloud_active 
                        ? 'bg-emerald-500/30 text-emerald-200' 
                        : 'bg-slate-800 text-slate-400'
                    }`}>
                      {dbStatus.is_cloud_active ? 'ACTIVE' : 'STANDBY'}
                    </span>
                  </div>

                  {/* SQLite Engine Chip */}
                  <div className={`flex items-center space-x-1 sm:space-x-1.5 px-2 sm:px-2.5 py-1 rounded-lg text-[10px] sm:text-xs font-mono font-bold transition-all ml-1 ${
                    !dbStatus.is_cloud_active
                      ? 'bg-cyber-cyan/25 text-cyan-200 border border-cyber-cyan/60 shadow-[0_0_18px_rgba(0,242,254,0.55)] ring-1 ring-cyber-cyan/40 glow-db-active-cyan'
                      : 'bg-white/[0.03] text-slate-400 border border-transparent opacity-65 group-hover:opacity-85'
                  }`}>
                    <span className={`w-2 h-2 rounded-full ${
                      !dbStatus.is_cloud_active
                        ? 'bg-cyber-cyan animate-pulse shadow-[0_0_8px_#00f2fe]'
                        : 'bg-slate-500'
                    }`} />
                    <span>🗄️ SQLite</span>
                    <span className={`text-[8px] sm:text-[9px] px-1.5 py-0.2 rounded font-sans uppercase font-extrabold tracking-wider ${
                      !dbStatus.is_cloud_active 
                        ? 'bg-cyan-500/30 text-cyan-200' 
                        : 'bg-slate-800 text-slate-400'
                    }`}>
                      {!dbStatus.is_cloud_active ? 'ACTIVE' : 'MIRROR'}
                    </span>
                  </div>
                </div>

                <button 
                  onClick={handleOpenStix}

                      onClick={() => checkDbStatus(true)}
                      disabled={dbPingLoading}
                      className="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-cyber-cyan/15 border border-cyber-cyan/40 text-cyber-cyan font-mono text-xs font-bold hover:bg-cyber-cyan hover:text-cyber-950 transition-all disabled:opacity-50 cursor-pointer"
                    >
                      <span>{dbPingLoading ? "Probing..." : "🔄 Re-probe Network"}</span>
                    </button>

                    <button
                      onClick={toggleAirGapMode}
                      disabled={dbPingLoading}
                      className={`inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-lg font-mono text-xs font-bold border transition-all disabled:opacity-50 cursor-pointer ${
                        dbStatus.is_cloud_active
                          ? 'bg-amber-500/20 border-amber-500/50 text-amber-300 hover:bg-amber-500/30'
                          : 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300 hover:bg-emerald-500/30'
                      }`}
                    >
                      <span>{dbStatus.is_cloud_active ? "📴 Simulate Air-Gapped Mode" : "☁️ Reconnect Supabase Cloud"}</span>
                    </button>
                  </div>

                  <button
                    onClick={() => setDbModalOpen(false)}
                    className="px-4 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white font-mono text-xs font-semibold cursor-pointer"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* STIX 2.1 Modal (Responsive) */}
          {stixModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-cyber-950/85 backdrop-blur-md">
              <div className="w-full max-w-3xl rounded-2xl border border-cyber-cyan/40 bg-cyber-900 p-4 sm:p-6 shadow-glow-cyan space-y-3 sm:space-y-4 max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <div className="flex items-center space-x-2">
                    <span className="text-[10px] sm:text-xs font-mono font-bold text-cyber-cyan uppercase">OASIS OPEN STANDARD</span>
                    <h3 className="text-base sm:text-lg font-bold text-white">STIX 2.1 Threat Intel Bundle</h3>
                  </div>
                  <button onClick={() => setStixModalOpen(false)} className="text-slate-400 hover:text-white text-2xl leading-none cursor-pointer p-1">✕</button>
                </div>
                <div className="flex items-center justify-between text-xs text-slate-400 flex-wrap gap-2">
                  <span>Standardized machine-readable bundle for SIEM / SOAR automation.</span>
                  <button
                    onClick={handleCopyStix}
                    className="font-mono px-3 py-1 rounded bg-white/10 hover:bg-white/20 text-white cursor-pointer"
                  >
                    {copiedStix ? "✓ Copied!" : "📋 Copy JSON"}
                  </button>
                </div>
                <pre className="flex-1 p-3 sm:p-4 rounded-xl bg-cyber-950 border border-white/10 font-mono text-[11px] sm:text-xs text-cyber-blue overflow-auto leading-relaxed max-w-full">
                  {stixContent}
                </pre>
              </div>
            </div>
          )}

          {/* Report Threat Modal (Responsive) */}
          {reportModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-cyber-950/85 backdrop-blur-md">
              <div className="w-full max-w-md rounded-2xl border border-cyber-cyan/40 bg-cyber-900 p-4 sm:p-6 shadow-glow-cyan space-y-3 sm:space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="text-base sm:text-lg font-bold text-white">Flag Malicious URL to Crowd Intel</h3>
                  <button onClick={() => setReportModalOpen(false)} className="text-slate-400 hover:text-white text-2xl leading-none cursor-pointer p-1">✕</button>
                </div>
                <form onSubmit={handleReportSubmit} className="space-y-3 sm:space-y-4 text-xs font-mono">
                  <div>
                    <label className="block text-slate-400 uppercase font-bold mb-1">Target URL or Host:</label>
                    <input
                      name="url"
                      defaultValue={scanData ? scanData.target_url : ""}
                      required
                      className="w-full p-2.5 rounded-lg bg-cyber-950 border border-white/10 text-white focus:outline-none focus:border-cyber-cyan text-xs"
                    />
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3">
                    <div>
                      <label className="block text-slate-400 uppercase font-bold mb-1">Category:</label>
                      <select name="category" className="w-full p-2.5 rounded-lg bg-cyber-950 border border-white/10 text-white focus:outline-none focus:border-cyber-cyan text-xs">
                        <option value="phishing">Phishing</option>
                        <option value="fake_recruitment">Job Scam</option>
                        <option value="rogue_cert">Weak Key / Cert</option>
                        <option value="scam">Financial Fraud</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 uppercase font-bold mb-1">Brand Spoofed:</label>
                      <input
                        name="brand"
                        defaultValue={scanData && scanData.threat_analysis.impersonated_brand ? scanData.threat_analysis.impersonated_brand : ""}
                        placeholder="e.g. PayPal, Chase"
                        className="w-full p-2.5 rounded-lg bg-cyber-950 border border-white/10 text-white focus:outline-none focus:border-cyber-cyan text-xs"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-400 uppercase font-bold mb-1">Incident Findings / Notes:</label>
                    <textarea
                      name="desc"
                      required
                      placeholder="Deceptive credential form, missing CT logs, etc."
                      className="w-full p-2.5 rounded-lg bg-cyber-950 border border-white/10 text-white focus:outline-none focus:border-cyber-cyan h-20 text-xs"
                    ></textarea>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setReportModalOpen(false)}
                      className="px-4 py-2 rounded-lg bg-white/5 border border-white/10 text-slate-300 hover:text-white cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-lg bg-cyber-cyan text-cyber-950 font-bold hover:bg-sky-400 cursor-pointer"
                    >
                      Submit Report
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Responsive Footer */}
          <footer className="border-t border-white/10 bg-cyber-950/90 py-5 sm:py-6 mt-8 sm:mt-12 no-print w-full">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 gap-3 text-center sm:text-left">
              <div>
                <span className="font-bold text-white">ThreatGuard AI</span> • Built for HackMatrix'26 Web Security Track
              </div>
              <div className="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 font-mono text-[10px] sm:text-[11px] text-cyber-cyan">
                <span>threat.py</span>
                <span>•</span>
                <span>webscan.py</span>
                <span>•</span>
                <span>certs.py</span>
                <span>•</span>
                <span>intel.py</span>
                <span>•</span>
                <span>risk.py</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount React App
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<DashboardApp />);
  </script>
</body>
</html>
